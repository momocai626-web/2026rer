<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 復健紀錄系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/components.js"></script>
</head>
<body>
    <div id="header-component"></div>

    <main>
        <div class="container form-narrow">
            <div class="card">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div style="font-size: 3.5rem; margin-bottom: 1rem; color: var(--primary-color);">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">系統登入</h1>
                    <p style="color: var(--text-secondary); font-size: 0.875rem;">請輸入姓名或 ID 與密碼</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">姓名或 ID</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">密碼</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;">
                        <i class="bi bi-shield-lock-fill"></i> <span>登入</span>
                    </button>
                </form>

                <div style="margin-top: 1.5rem;">
                    <a href="index.html" class="btn btn-outline" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;">
                        <i class="bi bi-arrow-left"></i> 返回首頁
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-component"></div>
    <div id="legal-modal-component"></div>
    <div id="toast-container-component"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec';

        document.addEventListener('DOMContentLoaded', () => {
            initComponents({
                header: true,
                headerOptions: { showLoginButton: false },
                footer: true,
                legalModal: true,
                toastContainer: true
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const originalContent = loginBtn.innerHTML;

            loginBtn.innerHTML = '<div class="loading-spinner" style="width:1.2rem; height:1.2rem; border-width:2px;"></div><span>登入中...</span>';
            loginBtn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'login', username, password })
                });
                const result = await response.json();

                if (!result.success) {
                    showToast(result.message || '帳號或密碼錯誤', 'error');
                    return;
                }

                const patient = result.data;
                sessionStorage.setItem('currentPatient', JSON.stringify(patient));
                showToast('登入成功', 'success');
                setTimeout(() => {
                    window.location.href = patient['角色'] === 'admin' ? 'admin.html' : 'rehab-form.html';
                }, 500);
            } catch (error) {
                console.error(error);
                showToast('無法連線到後端', 'error');
            } finally {
                loginBtn.innerHTML = originalContent;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
