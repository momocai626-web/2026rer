<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病患登入 - 復健紀錄管理系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">👤</div>
            <h1>歡迎回來</h1>
            <p>請輸入您的身分資訊以開始今日的復健紀錄</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">姓名或病患 ID</label>
                <input type="text" id="username" name="username" required placeholder="請輸入姓名或 ID" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">登入密碼</label>
                <input type="password" id="password" name="password" required placeholder="請輸入密碼" autocomplete="current-password">
            </div>
            
            <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                <span>確認登入</span>
            </button>
        </form>
        
        <div class="footer" style="margin-top: 2rem;">
            <a href="index.html" class="btn btn-outline" style="width: 100%;">返回首頁</a>
            <p style="margin-top: 1.5rem;">2026 復健管理系統 Professional v1.1</p>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 3000;"></div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 0.4s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const originalContent = loginBtn.innerHTML;
            
            loginBtn.innerHTML = '<div class="loading-spinner" style="width:1.2rem; height:1.2rem; border-width:2px;"></div><span>驗證中...</span>';
            loginBtn.disabled = true;
            
            const API_URL = 'https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec';
            
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'getPatients' })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    const patients = result.data;
                    const patient = patients.find(p => (p.姓名 === username || p.ID === username) && p.密碼 === password);
                    
                    if (patient) {
                        showToast('登入成功！正在導向...', 'success');
                        sessionStorage.setItem('currentPatient', JSON.stringify(patient));
                        setTimeout(() => {
                            window.location.href = (patient.角色 === 'admin') ? 'admin.html' : 'rehab-form.html';
                        }, 1000);
                    } else {
                        showToast('登入失敗，帳號或密碼錯誤', 'error');
                        loginBtn.innerHTML = originalContent;
                        loginBtn.disabled = false;
                    }
                } else {
                    showToast('伺服器錯誤: ' + result.message, 'error');
                    loginBtn.innerHTML = originalContent;
                    loginBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('網路連線異常', 'error');
                loginBtn.innerHTML = originalContent;
                loginBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
