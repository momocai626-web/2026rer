<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復健部 - 復健紀錄回報系統 | 臺大醫院雲林分院 斗六院區</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap Icons 5.3+ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="form-container">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <i class="bi bi-hospital-fill text-primary"></i> 斗六台大醫院 復健部
        </h2>
        <h4 style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-weight: 500;">每日復健紀錄回報系統</h4>
        <form id="rehabForm">
            <div class="form-group">
                <label>目前病患：<span id="patientNameDisplay" style="color:var(--primary-color); font-weight:700;"><i class="bi bi-person-fill" style="margin-right: 0.25rem;"></i>正在載入...</span></label>
                <input type="hidden" id="patientId" name="patientId">
            </div>
            
            <div class="form-group">
                <label for="date">復健日期</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label>疼痛程度 (VAS 評分)</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="painLevel" value="無痛" checked>
                        <span>無痛</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="painLevel" value="輕微">
                        <span>輕微</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="painLevel" value="中度">
                        <span>中度</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="painLevel" value="重度">
                        <span>重度</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="painLevel" value="極度">
                        <span>極度</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>完成運動項目</label>
                <div class="checkbox-group">
                    <label class="checkbox-option">
                        <input type="checkbox" name="exercise" value="爬牆">
                        <span>爬牆</span>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="exercise" value="毛巾操">
                        <span>毛巾操</span>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" name="exercise" value="鐘擺">
                        <span>鐘擺</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="remarks">個人備註 (選填)</label>
                <textarea id="remarks" name="remarks" placeholder="請紀錄今日復健的心得或任何不適感..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="bi bi-send-fill"></i> <span>送出復健紀錄</span>
            </button>
        </form>
        
        <div class="footer">
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1rem;">
                <button onclick="logout()" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-box-arrow-right"></i> 登出系統
                </button>
                <p>© 2026 臺大醫院雲林分院 斗六院區 復健部</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 3000;"></div>

    <script>
        // Toast 訊息函式
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 0.4s ease';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        document.getElementById('rehabForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            const exerciseCheckboxes = this.querySelectorAll('input[name="exercise"]:checked');
            data.exercise = Array.from(exerciseCheckboxes).map(cb => cb.value);
            
            // 基礎驗證
            if (!data.date) {
                showToast('請選擇日期', 'error');
                return;
            }

            const submitButton = document.getElementById('submitBtn');
            const originalContent = submitButton.innerHTML;
            submitButton.innerHTML = '<div class="loading-spinner" style="width:1.2rem; height:1.2rem; border-width:2px;"></div><span>送出中...</span>';
            submitButton.disabled = true;
            
            fetch('https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'createRecord', data: data })
            })
            .then(response => response.json())
            .then(result => {
                if(result.success) {
                    showToast('紀錄已成功送出！', 'success');
                    this.reset();
                    document.getElementById('date').valueAsDate = new Date();
                } else {
                    showToast(result.message || '送出失敗', 'error');
                }
            })
            .catch(error => {
                console.error('錯誤:', error);
                showToast('網路錯誤，請稍後再試', 'error');
            })
            .finally(() => {
                submitButton.innerHTML = originalContent;
                submitButton.disabled = false;
            });
        });
        
        document.getElementById('date').valueAsDate = new Date();

        document.addEventListener('DOMContentLoaded', function() {
            const patientData = sessionStorage.getItem('currentPatient');
            if (!patientData) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const patient = JSON.parse(patientData);
                if (patient.角色 && patient.角色 !== 'patient') {
                    showToast('此頁面僅供病患使用', 'info');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                    return;
                }
                document.getElementById('patientId').value = patient.ID || '';
                document.getElementById('patientNameDisplay').textContent = patient.姓名 || '未知患者';
            } catch (e) {
                console.error('解析失敗:', e);
            }
        });

        function logout() {
            sessionStorage.removeItem('currentPatient');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
