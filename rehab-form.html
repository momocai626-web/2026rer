<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復健紀錄 - 復健紀錄系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/components.js"></script>
</head>
<body>
    <div class="form-container">
        <h2 style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <i class="bi bi-hospital-fill text-primary"></i> 復健紀錄
        </h2>
        <h4 style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-weight: 500;">填寫每日復健狀況</h4>

        <form id="rehabForm">
            <div class="form-group">
                <label>目前病患：<span id="patientNameDisplay" style="color:var(--primary-color); font-weight:700;">讀取中...</span></label>
                <input type="hidden" id="patientId" name="patientId">
            </div>

            <div class="form-group">
                <label for="date">日期</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label style="display:flex; align-items:center; justify-content:space-between;">
                    <span>疼痛程度</span>
                    <button type="button" class="guide-btn" onclick="openPosterModal('images/poster-pain.png', '疼痛程度評估說明')">
                        <i class="bi bi-info-circle"></i> 說明
                    </button>
                </label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="painLevel" value="無痛" checked><span>無痛</span></label>
                    <label class="radio-option"><input type="radio" name="painLevel" value="輕微"><span>輕微</span></label>
                    <label class="radio-option"><input type="radio" name="painLevel" value="中度"><span>中度</span></label>
                    <label class="radio-option"><input type="radio" name="painLevel" value="重度"><span>重度</span></label>
                    <label class="radio-option"><input type="radio" name="painLevel" value="極度"><span>極度</span></label>
                </div>
            </div>

            <div class="form-group">
                <label style="display:flex; align-items:center; justify-content:space-between;">
                    <span>完成運動</span>
                    <button type="button" class="guide-btn" onclick="openPosterModal('images/poster-exercise.png', '五十肩居家復健運動')">
                        <i class="bi bi-play-circle"></i> 示範
                    </button>
                </label>
                <div class="checkbox-group">
                    <label class="checkbox-option"><input type="checkbox" name="exercise" value="爬牆"><span>爬牆</span></label>
                    <label class="checkbox-option"><input type="checkbox" name="exercise" value="毛巾操"><span>毛巾操</span></label>
                    <label class="checkbox-option"><input type="checkbox" name="exercise" value="鐘擺"><span>鐘擺</span></label>
                </div>
            </div>

            <div class="form-group">
                <label for="remarks">備註</label>
                <textarea id="remarks" name="remarks" placeholder="可填寫不適、活動限制或其他補充"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="bi bi-send-fill"></i> <span>送出紀錄</span>
            </button>
        </form>

        <div class="footer">
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem; margin-top: 1rem;">
                <button onclick="logout()" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-box-arrow-right"></i> 登出
                </button>
                <p>© 2026 復健紀錄系統</p>
            </div>
        </div>
    </div>

    <div id="toast-container-component"></div>

    <!-- 海報燈箱 Modal -->
    <div id="posterModal" class="modal poster-modal" onclick="closePosterModal()">
        <div class="poster-modal-inner" onclick="event.stopPropagation()">
            <button class="poster-close-btn" onclick="closePosterModal()"><i class="bi bi-x-lg"></i></button>
            <p id="posterModalTitle" style="text-align:center; font-weight:600; margin-bottom:1rem; color:var(--primary-color); font-size:1rem;"></p>
            <img id="posterModalImg" src="" alt="衛教海報" style="max-width:100%; max-height:80vh; border-radius:0.75rem; display:block; margin:0 auto;">
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec';

        document.addEventListener('DOMContentLoaded', () => {
            initComponents({ header: false, footer: false, legalModal: false, toastContainer: true });

            const patientData = sessionStorage.getItem('currentPatient');
            if (!patientData) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const patient = JSON.parse(patientData);
                if (!patient['角色'] || patient['角色'] !== 'patient') {
                    window.location.href = 'index.html';
                    return;
                }

                document.getElementById('patientId').value = patient.ID || '';
                document.getElementById('patientNameDisplay').textContent = patient['姓名'] || '未命名病患';
                document.getElementById('date').valueAsDate = new Date();
            } catch (error) {
                console.error(error);
                window.location.href = 'login.html';
            }
        });

        document.getElementById('rehabForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            data.exercise = Array.from(this.querySelectorAll('input[name="exercise"]:checked')).map(item => item.value);

            if (!data.patientId) {
                showToast('找不到病患 ID，請重新登入', 'error');
                return;
            }

            const submitButton = document.getElementById('submitBtn');
            const originalContent = submitButton.innerHTML;
            submitButton.innerHTML = '<div class="loading-spinner" style="width:1.2rem; height:1.2rem; border-width:2px;"></div><span>送出中...</span>';
            submitButton.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'createRecord', data })
                });
                const result = await response.json();

                if (result.success) {
                    showToast('紀錄已送出', 'success');
                    this.reset();
                    document.getElementById('patientId').value = data.patientId;
                    document.getElementById('date').valueAsDate = new Date();
                } else {
                    showToast(result.message || '送出失敗', 'error');
                }
            } catch (error) {
                console.error(error);
                showToast('無法連線到後端', 'error');
            } finally {
                submitButton.innerHTML = originalContent;
                submitButton.disabled = false;
            }
        });

        function logout() {
            sessionStorage.removeItem('currentPatient');
            window.location.href = 'index.html';
        }

        function openPosterModal(src, title) {
            document.getElementById('posterModalImg').src = src;
            document.getElementById('posterModalTitle').textContent = title;
            document.getElementById('posterModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closePosterModal() {
            document.getElementById('posterModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closePosterModal();
        });
    </script>
</body>
</html>
