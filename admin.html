<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨床管理後台 - 復健生理回饋系統 | 臺大醫院雲林分院 斗六院區 復健部</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 Bootstrap Icons 5.3+ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
            <h2 style="margin:0; text-align:left; display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem;">
                <i class="bi bi-hospital-fill text-primary"></i> 斗六台大醫院 復健部 - 臨床管理後台
            </h2>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <span id="adminName" style="color: var(--text-secondary); font-size: 0.875rem; font-weight:600; display: inline-flex; align-items: center; gap: 0.25rem;">
                    <i class="bi bi-person-workspace text-primary"></i> 管理員
                </span>
                <button onclick="logout()" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.825rem; display: inline-flex; align-items: center; gap: 0.25rem;">
                    <i class="bi bi-box-arrow-right"></i> 登出
                </button>
            </div>
        </div>
        
        <!-- 二元化 Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="account-mgmt" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                <i class="bi bi-people-fill"></i> 患者帳號管理
            </button>
            <button class="tab" data-tab="data-analysis" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                <i class="bi bi-bar-chart-line-fill"></i> 復健數據分析
            </button>
        </div>
        
        <!-- 分頁一：帳號管理 -->
        <div id="account-mgmt-tab" class="tab-content active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h3 style="margin:0; display: inline-flex; align-items: center; gap: 0.35rem;"><i class="bi bi-list-task text-primary"></i> 病患帳號名單</h3>
                <button class="btn btn-primary" onclick="openAddModal()" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-person-plus-fill"></i> <span>新增患者</span>
                </button>
            </div>
            <div class="table-wrapper">
                <table class="patients-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>病歷號</th>
                            <th>角色</th>
                            <th style="text-align: right;">功能連動</th>
                        </tr>
                    </thead>
                    <tbody id="patients-table-body"></tbody>
                </table>
            </div>
        </div>
        
        <!-- 分頁二：數據分析 (整合全院與個人) -->
        <div id="data-analysis-tab" class="tab-content">
            <div style="background: var(--primary-light); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem; border: 1px solid var(--primary-color); display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
                <div style="display: flex; align-items: center; gap: 1rem; flex: 1;">
                    <label style="font-weight:700; color:var(--primary-color); white-space:nowrap; display: inline-flex; align-items: center; gap: 0.25rem;">
                        <i class="bi bi-search"></i> 分析對象：
                    </label>
                    <select id="analysis-patient-select" style="max-width:350px; font-weight:600;">
                        <option value="all">-- 全院趨勢統計 (平均值) --</option>
                    </select>
                </div>
                <button id="refresh-analysis-btn" class="btn btn-outline" style="padding:0.4rem 1rem; font-size:0.875rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-arrow-clockwise"></i> 重新整理
                </button>
            </div>

            <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                <h3 id="chartTitle" style="display: inline-flex; align-items: center; gap: 0.35rem;">數據趨勢圖</h3>
                <div style="width: 100%; height: 350px;">
                    <canvas id="analysisChart"></canvas>
                </div>
            </div>

            <!-- 明細區塊：僅在選擇特定病患時顯示 -->
            <div id="individual-detail-section" style="display:none;">
                <div class="table-wrapper">
                    <div style="padding:1rem; background:#f8fafc; border-bottom:1px solid var(--border-color);">
                        <h3 style="margin:0; font-size:1rem; display: inline-flex; align-items: center; gap: 0.35rem;" id="detailSectionTitle">
                            <i class="bi bi-file-earmark-text-fill text-primary"></i> 該員復健歷史明細
                        </h3>
                    </div>
                    <table class="patients-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>疼痛程度</th>
                                <th>完成運動</th>
                                <th>備註</th>
                                <th style="text-align: right;">管理</th>
                            </tr>
                        </thead>
                        <tbody id="analysis-records-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>臺大醫院雲林分院 斗六院區 復健部 V1.0.0</p>
        </div>

        <!-- Modals & Toasts (Consistent) -->
        <div id="toastContainer" class="toast-container"></div>
        <div id="patientModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeModal()" style="position: absolute; top: 1rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer;">&times;</span>
                <h3 id="modalTitle" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary-color);">帳號資料</h3>
                <form id="patientForm">
                    <input type="hidden" id="editPatientId">
                    <div class="form-group"><label>姓名</label><input type="text" id="modalName" required></div>
                    <div class="form-group"><label>登入密碼</label><input type="password" id="modalPassword" required></div>
                    <div class="form-group"><label>病歷號碼</label><input type="text" id="modalRecord"></div>
                    <div class="form-group">
                        <label>角色權限</label>
                        <select id="modalRole">
                            <option value="patient">病患 (patient)</option>
                            <option value="admin">管理員 (admin)</option>
                        </select>
                    </div>
                    <div style="margin-top:2rem; display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                        <button type="submit" class="btn btn-primary" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;"><i class="bi bi-check-lg"></i> 儲存資料</button>
                        <button type="button" class="btn btn-outline" onclick="closeModal()" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;"><i class="bi bi-x-lg"></i> 取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec';
        let patients = [], records = [];
        let currentChart = null;
        const painMap = { '無痛': 0, '輕微': 1, '中度': 2, '重度': 3, '極度': 4 };

        document.addEventListener('DOMContentLoaded', () => {
            const adminData = sessionStorage.getItem('currentPatient');
            if (!adminData || JSON.parse(adminData).角色 !== 'admin') { window.location.href = 'index.html'; return; }
            document.getElementById('adminName').textContent = `管理員: ${JSON.parse(adminData).姓名}`;
            init();
        });

        async function init() {
            await Promise.all([loadPatients(), loadRecords()]);
            setupEventListeners();
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
                    tab.classList.add('active');
                    const tabName = tab.getAttribute('data-tab');
                    document.getElementById(`${tabName}-tab`).classList.add('active');
                    if (tabName === 'data-analysis') runAnalysis(document.getElementById('analysis-patient-select').value);
                });
            });

            document.getElementById('analysis-patient-select').addEventListener('change', (e) => runAnalysis(e.target.value));
            document.getElementById('refresh-analysis-btn').addEventListener('click', async () => { 
                showToast('正在更新數據...', 'info');
                await loadRecords(); 
                runAnalysis(document.getElementById('analysis-patient-select').value); 
            });
        }

        async function apiRequest(action, data = null, id = null) {
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, data, id }) });
                return await res.json();
            } catch (e) { return { success: false, message: '網路錯誤' }; }
        }

        async function loadPatients() {
            const res = await apiRequest('getPatients');
            if (res.success) {
                patients = res.data || [];
                renderPatientsTable();
                populateAnalysisSelect();
            }
        }

        async function loadRecords() {
            const res = await apiRequest('getRecords');
            if (res.success) records = res.data || [];
        }

        function populateAnalysisSelect() {
            const select = document.getElementById('analysis-patient-select');
            const current = select.value;
            select.innerHTML = '<option value="all">-- 全院趨勢統計 (平均值) --</option>';
            patients.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.ID; opt.textContent = `${p.姓名} (${p.病歷號 || '無病歷'})`;
                select.appendChild(opt);
            });
            select.value = current || 'all';
        }

        function renderPatientsTable() {
            document.getElementById('patients-table-body').innerHTML = patients.map(p => `
                <tr>
                    <td><code>${p.ID}</code></td>
                    <td><strong>${p.姓名}</strong></td>
                    <td>${p.病歷號 || '-'}</td>
                    <td><span class="badge ${p.角色 === 'admin' ? 'btn-danger' : 'btn-info'}" style="padding:2px 8px; border-radius:10px; font-size:11px;">${p.角色}</span></td>
                    <td style="text-align: right; white-space: nowrap;">
                        <button class="btn btn-primary" style="padding:4px 10px; font-size:11px; display:inline-flex; align-items:center; gap:0.25rem;" onclick="jumpToAnalysis('${p.ID}')"><i class="bi bi-bar-chart-line-fill"></i> 數據分析</button>
                        <button class="btn btn-outline" style="padding:4px 10px; font-size:11px; display:inline-flex; align-items:center; gap:0.25rem;" onclick='openEditModal(${JSON.stringify(p)})'><i class="bi bi-pencil-fill"></i> 編輯</button>
                        <button class="btn btn-danger" style="padding:4px 10px; font-size:11px; border:none; display:inline-flex; align-items:center; gap:0.25rem;" onclick="deletePatient('${p.ID}')"><i class="bi bi-trash-fill"></i> 刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function jumpToAnalysis(id) {
            document.querySelector('.tab[data-tab="data-analysis"]').click();
            document.getElementById('analysis-patient-select').value = id;
            runAnalysis(id);
        }

        // --- Core Analysis Logic (The "Smart" part) ---
        function runAnalysis(targetId) {
            const ctx = document.getElementById('analysisChart').getContext('2d');
            const title = document.getElementById('chartTitle');
            const detailSection = document.getElementById('individual-detail-section');
            const tbody = document.getElementById('analysis-records-body');
            
            if (currentChart) currentChart.destroy();
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

            if (records.length === 0) {
                title.textContent = '尚無紀錄數據';
                return;
            }

            if (targetId === 'all') {
                // 全院模式
                title.innerHTML = '<i class="bi bi-bar-chart-line-fill text-primary" style="margin-right: 0.35rem;"></i> 全院復健疼痛趨勢 (平均值)';
                detailSection.style.display = 'none';
                
                const grouped = {};
                records.forEach(r => {
                    if (!r.日期) return;
                    const d = new Date(r.日期).toLocaleDateString();
                    if (!grouped[d]) grouped[d] = { total: 0, count: 0 };
                    const score = painMap[r.疼痛程度];
                    if (score !== undefined) { grouped[d].total += score; grouped[d].count += 1; }
                });

                const data = Object.keys(grouped).sort((a,b) => new Date(a)-new Date(b)).map(d => ({ x: d, y: (grouped[d].total / grouped[d].count).toFixed(1) }));

                currentChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(d => d.x),
                        datasets: [{ label: '平均疼痛指數', data: data.map(d => d.y), backgroundColor: 'rgba(13, 148, 136, 0.4)', borderColor: '#0d9488', borderWidth: 2 }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 4, title: { display: true, text: '疼痛等級 (0-4)' } } } }
                });

            } else {
                // 個案模式
                const patient = patients.find(p => p.ID === targetId);
                title.innerHTML = `<i class="bi bi-activity text-primary" style="margin-right: 0.35rem;"></i> 復健進度曲線 - ${patient ? patient.姓名 : '查無此人'}`;
                detailSection.style.display = 'block';

                const individualRecords = records.filter(r => r.病患ID == targetId).sort((a,b) => new Date(a.日期)-new Date(b.日期));

                if (individualRecords.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">此病患尚無歷史紀錄</td></tr>';
                    // 畫一個空白圖表
                    currentChart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false } });
                } else {
                    currentChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: individualRecords.map(r => new Date(r.日期).toLocaleDateString()),
                            datasets: [{ label: '疼痛指數', data: individualRecords.map(r => painMap[r.疼痛程度]), borderColor: '#0284c7', backgroundColor: 'rgba(2, 132, 199, 0.1)', fill: true, tension: 0.3, pointRadius: 5 }]
                        },
                        options: { 
                            responsive: true, 
                            maintainAspectRatio: false, 
                            scales: { y: { min: 0, max: 4, ticks: { callback: v => Object.keys(painMap).find(k => painMap[k] === v) } } }
                        }
                    });

                    tbody.innerHTML = individualRecords.map(r => `
                        <tr>
                            <td>${new Date(r.日期).toLocaleDateString()}</td>
                            <td><span style="font-weight:700; color:var(--secondary-color);">${r.疼痛程度}</span></td>
                            <td>${r['完成運動'] || '-'}</td>
                            <td><small>${r.備註 || ''}</small></td>
                            <td style="text-align:right;"><button class="btn btn-danger" style="padding:2px 8px; font-size:10px; border:none; display:inline-flex; align-items:center; gap:0.25rem;" onclick="deleteRecord('${r['']}')"><i class="bi bi-trash-fill"></i> 刪除</button></td>
                        </tr>
                    `).reverse().join('');
                }
            }
        }

        async function deletePatient(id) {
            if (!confirm('確定刪除此患者帳號？')) return;
            const res = await apiRequest('deletePatient', null, id);
            if (res.success) { showToast('帳號已刪除'); loadPatients(); }
        }

        async function deleteRecord(rowId) {
            if (!confirm('確定刪除此筆復健紀錄？')) return;
            const res = await apiRequest('deleteRecord', null, rowId);
            if (res.success) { showToast('紀錄已刪除'); await loadRecords(); runAnalysis(document.getElementById('analysis-patient-select').value); }
        }

        // UI Helpers
        function showToast(m, t='success') {
            const c = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${t}`; toast.textContent = m;
            c.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
        }
        function openAddModal() { document.getElementById('modalTitle').innerHTML = '<i class="bi bi-person-fill-add" style="margin-right: 0.35rem;"></i> 新增病患帳號'; document.getElementById('patientForm').reset(); document.getElementById('editPatientId').value = ''; document.getElementById('patientModal').style.display = 'flex'; }
        function openEditModal(p) { document.getElementById('modalTitle').innerHTML = '<i class="bi bi-pencil-square" style="margin-right: 0.35rem;"></i> 編輯資料'; document.getElementById('editPatientId').value = p.ID; document.getElementById('modalName').value = p.姓名; document.getElementById('modalPassword').value = p.密碼; document.getElementById('modalRecord').value = p.病歷號; document.getElementById('modalRole').value = p.角色; document.getElementById('patientModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('patientModal').style.display = 'none'; }
        function logout() { sessionStorage.removeItem('currentPatient'); window.location.href = 'index.html'; }

        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editPatientId').value;
            const data = { name: document.getElementById('modalName').value.trim(), password: document.getElementById('modalPassword').value, medicalRecordNumber: document.getElementById('modalRecord').value.trim(), role: document.getElementById('modalRole').value };
            const res = id ? await apiRequest('updatePatient', data, id) : await apiRequest('createPatient', data);
            if (res.success) { showToast(res.message); closeModal(); loadPatients(); }
        });
    </script>
</body>
</html>
