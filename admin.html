<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理 - 醫療專業版 v1.3</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
            <h2 style="margin:0; text-align:left;">🏥 醫療管理後台</h2>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <span id="adminName" style="color: var(--text-secondary); font-size: 0.875rem; font-weight:600;">管理員</span>
                <button onclick="logout()" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.825rem;">登出系統</button>
            </div>
        </div>
        
        <!-- Tabs Nav -->
        <div class="tabs">
            <button class="tab active" data-tab="patients">👥 病患帳號管理</button>
            <button class="tab" data-tab="global-stats">📊 全院趨勢統計</button>
            <button class="tab" data-tab="individual-analysis">🩺 個案進度分析</button>
        </div>
        
        <!-- Tab 1: 患者帳號管理 -->
        <div id="patients-tab" class="tab-content active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                <h3 style="margin:0;">病患清單</h3>
                <button class="btn btn-primary" onclick="openAddModal()"><span>+ 新增帳號</span></button>
            </div>
            <div class="table-wrapper">
                <table class="patients-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>病歷號</th>
                            <th>角色</th>
                            <th style="text-align: right;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="patients-table-body"></tbody>
                </table>
            </div>
        </div>
        
        <!-- Tab 2: 全院趨勢統計 -->
        <div id="global-stats-tab" class="tab-content">
            <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                <h3>📈 全院疼痛平均趨勢 (BI)</h3>
                <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">匯整所有病患的每日平均疼痛指數，監控整體復健成效。</p>
                <div style="width: 100%; height: 400px;">
                    <canvas id="globalPainChart"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Tab 3: 個案進度分析 -->
        <div id="individual-analysis-tab" class="tab-content">
            <div style="background: var(--primary-light); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem; border: 1px solid var(--primary-color); display: flex; align-items: center; gap: 1.5rem;">
                <div style="flex-shrink: 0;">
                    <label style="font-weight:700; color:var(--primary-color);">🔍 選取分析對象：</label>
                </div>
                <select id="patient-select" style="max-width:300px; font-weight:600;">
                    <option value="">-- 請選擇病患 --</option>
                </select>
                <div id="patientInfoSummary" style="color:var(--text-secondary); font-size:0.9rem; font-style:italic;">
                    選擇病患後將載入其專屬復健曲線與明細
                </div>
            </div>

            <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                <h3 id="individualChartTitle">📈 個人疼痛變化曲線</h3>
                <div style="width: 100%; height: 300px;">
                    <canvas id="individualPainChart"></canvas>
                </div>
            </div>

            <div class="table-wrapper">
                <div style="padding:1rem; background:#f8fafc; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0; font-size:1rem;">📋 個人歷史紀錄明細</h3>
                    <button id="refresh-individual-btn" class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.875rem;">🔄 刷新數據</button>
                </div>
                <table class="patients-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>疼痛程度</th>
                            <th>完成運動</th>
                            <th>個人備註</th>
                            <th style="text-align: right;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="individual-records-body"></tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <p>復健紀錄管理系統 - 醫療專業版 v1.3 | 致力於數據驅動的康復體驗</p>
        </div>

        <!-- Toast & Modal (Unchanged Layout) -->
        <div id="toastContainer" class="toast-container"></div>
        <div id="patientModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeModal()" style="position: absolute; top: 1rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer;">&times;</span>
                <h3 id="modalTitle" style="margin-bottom: 1.5rem;">帳號資料</h3>
                <form id="patientForm">
                    <input type="hidden" id="editPatientId">
                    <div class="form-group"><label>姓名</label><input type="text" id="modalName" required></div>
                    <div class="form-group"><label>登入密碼</label><input type="password" id="modalPassword" required></div>
                    <div class="form-group"><label>病歷號碼</label><input type="text" id="modalRecord"></div>
                    <div class="form-group">
                        <label>帳號權限</label>
                        <select id="modalRole">
                            <option value="patient">病患 (patient)</option>
                            <option value="admin">管理員 (admin)</option>
                        </select>
                    </div>
                    <div style="margin-top:2rem; display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                        <button type="submit" class="btn btn-primary">儲存資料</button>
                        <button type="button" class="btn btn-outline" onclick="closeModal()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec';
        let patients = [], records = [];
        let globalChart = null, individualChart = null;
        const painMap = { '無痛': 0, '輕微': 1, '中度': 2, '重度': 3, '極度': 4 };

        document.addEventListener('DOMContentLoaded', () => {
            const adminData = sessionStorage.getItem('currentPatient');
            if (!adminData || JSON.parse(adminData).角色 !== 'admin') {
                window.location.href = 'index.html'; return;
            }
            document.getElementById('adminName').textContent = `管理員: ${JSON.parse(adminData).姓名}`;
            init();
        });

        async function init() {
            await loadPatients();
            await loadRecords();
            setupEventListeners();
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
                    tab.classList.add('active');
                    const tabName = tab.getAttribute('data-tab');
                    document.getElementById(`${tabName}-tab`).classList.add('active');
                    
                    if (tabName === 'global-stats') updateGlobalChart();
                    if (tabName === 'individual-analysis') updateIndividualView(document.getElementById('patient-select').value);
                });
            });

            document.getElementById('patient-select').addEventListener('change', (e) => updateIndividualView(e.target.value));
            document.getElementById('refresh-individual-btn').addEventListener('click', async () => { await loadRecords(); updateIndividualView(document.getElementById('patient-select').value); });
        }

        async function apiRequest(action, data = null, id = null) {
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, data, id }) });
                return await res.json();
            } catch (e) { return { success: false, message: '網路錯誤' }; }
        }

        async function loadPatients() {
            const res = await apiRequest('getPatients');
            if (res.success) {
                patients = res.data || [];
                renderPatientsTable();
                populatePatientSelect();
            }
        }

        async function loadRecords() {
            const res = await apiRequest('getRecords');
            if (res.success) records = res.data || [];
        }

        function populatePatientSelect() {
            const select = document.getElementById('patient-select');
            const current = select.value;
            select.innerHTML = '<option value="">-- 請選擇分析對象 --</option>';
            patients.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.ID; opt.textContent = `${p.姓名} (${p.病歷號 || '無病歷'})`;
                select.appendChild(opt);
            });
            select.value = current;
        }

        function renderPatientsTable() {
            document.getElementById('patients-table-body').innerHTML = patients.map(p => `
                <tr>
                    <td><code>${p.ID}</code></td>
                    <td><strong>${p.姓名}</strong></td>
                    <td>${p.病歷號 || '-'}</td>
                    <td><span class="badge ${p.角色 === 'admin' ? 'btn-danger' : 'btn-info'}" style="padding:2px 8px; border-radius:10px; font-size:11px;">${p.角色}</span></td>
                    <td style="text-align: right;">
                        <button class="btn btn-primary" style="padding:4px 10px; font-size:11px;" onclick="jumpToIndividual('${p.ID}')">進度分析</button>
                        <button class="btn btn-outline" style="padding:4px 10px; font-size:11px;" onclick='openEditModal(${JSON.stringify(p)})'>編輯</button>
                    </td>
                </tr>
            `).join('');
        }

        function jumpToIndividual(id) {
            document.querySelector('.tab[data-tab="individual-analysis"]').click();
            document.getElementById('patient-select').value = id;
            updateIndividualView(id);
        }

        // --- Global BI Logic ---
        function updateGlobalChart() {
            const ctx = document.getElementById('globalPainChart').getContext('2d');
            if (globalChart) globalChart.destroy();
            
            const grouped = {};
            records.forEach(r => {
                if (!r.日期) return;
                const d = new Date(r.日期).toLocaleDateString();
                if (!grouped[d]) grouped[d] = { total: 0, count: 0 };
                const score = painMap[r.疼痛程度];
                if (score !== undefined) { grouped[d].total += score; grouped[d].count += 1; }
            });

            const data = Object.keys(grouped).sort((a,b) => new Date(a)-new Date(b)).map(d => ({ x: d, y: (grouped[d].total / grouped[d].count).toFixed(1) }));

            globalChart = new Chart(ctx, {
                type: 'bar', // 全體用長條圖更具統計感
                data: {
                    labels: data.map(d => d.x),
                    datasets: [{ label: '全院平均疼痛', data: data.map(d => d.y), backgroundColor: 'rgba(13, 148, 136, 0.4)', borderColor: '#0d9488', borderWidth: 2 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 4 } } }
            });
        }

        // --- Individual Analysis Logic ---
        function updateIndividualView(id) {
            const ctx = document.getElementById('individualPainChart').getContext('2d');
            const tbody = document.getElementById('individual-records-body');
            const summary = document.getElementById('patientInfoSummary');
            
            if (individualChart) individualChart.destroy();
            tbody.innerHTML = '';

            if (!id) {
                summary.textContent = '請從上方選單選擇病患...';
                return;
            }

            const patient = patients.find(p => p.ID === id);
            summary.textContent = `正在檢視：${patient.姓名} (病歷號: ${patient.病歷號 || '未填'})`;

            const individualRecords = records.filter(r => r.病患ID == id).sort((a,b) => new Date(a.日期)-new Date(b.日期));

            if (individualRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">該病患尚無歷史紀錄</td></tr>';
                return;
            }

            // 繪圖
            individualChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: individualRecords.map(r => new Date(r.日期).toLocaleDateString()),
                    datasets: [{ label: '疼痛趨勢', data: individualRecords.map(r => painMap[r.疼痛程度]), borderColor: '#0284c7', backgroundColor: 'rgba(2, 132, 199, 0.1)', fill: true, tension: 0.3 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 4, ticks: { callback: v => Object.keys(painMap).find(k => painMap[k] === v) } } } }
            });

            // 表格明細
            tbody.innerHTML = individualRecords.map(r => `
                <tr>
                    <td>${new Date(r.日期).toLocaleDateString()}</td>
                    <td><span style="font-weight:700; color:var(--secondary-color);">${r.疼痛程度}</span></td>
                    <td>${r['完成運動'] || '-'}</td>
                    <td><small>${r.備註 || ''}</small></td>
                    <td style="text-align:right;"><button class="btn btn-danger" style="padding:2px 8px; font-size:10px; border:none;" onclick="deleteRecord('${r['']}')">刪除</button></td>
                </tr>
            `).reverse().join('');
        }

        async function deleteRecord(rowId) {
            if (!confirm('確定刪除此筆紀錄？')) return;
            const res = await apiRequest('deleteRecord', null, rowId);
            if (res.success) { showToast('紀錄已刪除'); await loadRecords(); updateIndividualView(document.getElementById('patient-select').value); }
        }

        // UI Helpers
        function showToast(m, t='success') {
            const c = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${t}`; toast.textContent = m;
            c.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
        }
        function openAddModal() { document.getElementById('modalTitle').textContent = '👤 新增病患帳號'; document.getElementById('patientForm').reset(); document.getElementById('editPatientId').value = ''; document.getElementById('patientModal').style.display = 'flex'; }
        function openEditModal(p) { document.getElementById('modalTitle').textContent = '✏️ 編輯資料'; document.getElementById('editPatientId').value = p.ID; document.getElementById('modalName').value = p.姓名; document.getElementById('modalPassword').value = p.密碼; document.getElementById('modalRecord').value = p.病歷號; document.getElementById('modalRole').value = p.角色; document.getElementById('patientModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('patientModal').style.display = 'none'; }
        function logout() { sessionStorage.removeItem('currentPatient'); window.location.href = 'index.html'; }

        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editPatientId').value;
            const data = { name: document.getElementById('modalName').value.trim(), password: document.getElementById('modalPassword').value, medicalRecordNumber: document.getElementById('modalRecord').value.trim(), role: document.getElementById('modalRole').value };
            const res = id ? await apiRequest('updatePatient', data, id) : await apiRequest('createPatient', data);
            if (res.success) { showToast(res.message); closeModal(); loadPatients(); }
        });
    </script>
</body>
</html>
