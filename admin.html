<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理 - 復健紀錄系統</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/components.js"></script>
</head>
<body>
    <div class="admin-container">
        <div id="admin-header-component"></div>
        <div id="admin-tabs-component"></div>

        <div id="account-mgmt-tab" class="tab-content active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; gap: 1rem; flex-wrap: wrap;">
                <h3 style="margin:0; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-list-task text-primary"></i> 帳號管理
                </h3>
                <button class="btn btn-primary" onclick="openAddModal()" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-person-plus-fill"></i> <span>新增帳號</span>
                </button>
            </div>

            <div class="table-wrapper">
                <table class="patients-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>姓名</th>
                            <th>病歷號</th>
                            <th>角色</th>
                            <th style="text-align: right;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="patients-table-body"></tbody>
                </table>
            </div>
        </div>

        <div id="data-analysis-tab" class="tab-content">
            <div style="background: var(--primary-light); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 2rem; border: 1px solid var(--primary-color); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 1rem; flex: 1; min-width: 260px;">
                    <label for="analysis-patient-select" style="font-weight:700; color:var(--primary-color); white-space:nowrap; display: inline-flex; align-items: center; gap: 0.25rem;">
                        <i class="bi bi-search"></i> 選擇病患
                    </label>
                    <select id="analysis-patient-select" style="max-width:350px; font-weight:600;">
                        <option value="all">全部病患平均</option>
                    </select>
                </div>
                <button id="refresh-analysis-btn" class="btn btn-outline" style="padding:0.4rem 1rem; font-size:0.875rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="bi bi-arrow-clockwise"></i> 重新整理
                </button>
            </div>

            <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
                <h3 id="chartTitle" style="display: inline-flex; align-items: center; gap: 0.35rem;">復健數據</h3>
                <div style="width: 100%; height: 350px;">
                    <canvas id="analysisChart"></canvas>
                </div>
            </div>

            <div id="individual-detail-section" style="display:none;">
                <div class="table-wrapper">
                    <div style="padding:1rem; background:#f8fafc; border-bottom:1px solid var(--border-color);">
                        <h3 style="margin:0; font-size:1rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                            <i class="bi bi-file-earmark-text-fill text-primary"></i> 個別紀錄
                        </h3>
                    </div>
                    <table class="patients-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>疼痛程度</th>
                                <th>完成運動</th>
                                <th>備註</th>
                                <th style="text-align: right;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="analysis-records-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="admin-footer-component"></div>
        <div id="toast-container-component"></div>

        <div id="patientModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close" onclick="closeModal()" style="position: absolute; top: 1rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer;">&times;</span>
                <h3 id="modalTitle" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary-color);">帳號資料</h3>
                <form id="patientForm">
                    <input type="hidden" id="editPatientId">
                    <div class="form-group"><label for="modalName">姓名</label><input type="text" id="modalName" required></div>
                    <div class="form-group"><label for="modalPassword">密碼</label><input type="password" id="modalPassword" required></div>
                    <div class="form-group"><label for="modalRecord">病歷號</label><input type="text" id="modalRecord"></div>
                    <div class="form-group">
                        <label for="modalRole">角色</label>
                        <select id="modalRole">
                            <option value="patient">病患</option>
                            <option value="admin">管理員</option>
                        </select>
                    </div>
                    <div style="margin-top:2rem; display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                        <button type="submit" class="btn btn-primary" style="display: inline-flex; align-items:center; justify-content:center; gap:0.35rem;"><i class="bi bi-check-lg"></i> 儲存</button>
                        <button type="button" class="btn btn-outline" onclick="closeModal()" style="display: inline-flex; align-items:center; justify-content:center; gap:0.35rem;"><i class="bi bi-x-lg"></i> 取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyb_GkXOiv8-soq6hOUVTHdKRsayFsP56WkA6SOhD9aOxmab5OxXUUbguWFpwnhiVDcjQ/exec';
        const painMap = { '無痛': 0, '輕微': 1, '中度': 2, '重度': 3, '極度': 4 };
        const painLabels = ['無痛', '輕微', '中度', '重度', '極度'];

        let patients = [];
        let records = [];
        let currentChart = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const adminData = sessionStorage.getItem('currentPatient');
            if (!adminData) {
                window.location.href = 'login.html';
                return;
            }

            const admin = JSON.parse(adminData);
            if (admin['角色'] !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            initComponents({
                header: false,
                footer: false,
                legalModal: false,
                adminHeader: true,
                adminHeaderOptions: { adminName: `管理員：${admin['姓名'] || admin.ID}` },
                adminTabs: true,
                adminFooter: true,
                toastContainer: true
            });

            setupEventListeners();
            await init();
        });

        async function init() {
            await Promise.all([loadPatients(), loadRecords()]);
            runAnalysis('all');
        }

        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab, .tab-content').forEach(item => item.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                    if (tab.dataset.tab === 'data-analysis') {
                        runAnalysis(document.getElementById('analysis-patient-select').value);
                    }
                });
            });

            document.getElementById('analysis-patient-select').addEventListener('change', event => runAnalysis(event.target.value));
            document.getElementById('refresh-analysis-btn').addEventListener('click', async () => {
                await Promise.all([loadPatients(), loadRecords()]);
                runAnalysis(document.getElementById('analysis-patient-select').value);
                showToast('資料已更新');
            });

            document.getElementById('patientForm').addEventListener('submit', savePatient);
        }

        async function apiRequest(action, data = null, id = null) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action, data, id })
                });
                return await response.json();
            } catch (error) {
                console.error(error);
                return { success: false, message: '無法連線到後端' };
            }
        }

        async function loadPatients() {
            const result = await apiRequest('getPatients');
            if (!result.success) {
                showToast(result.message || '讀取帳號失敗', 'error');
                return;
            }

            patients = result.data || [];
            renderPatientsTable();
            populateAnalysisSelect();
        }

        async function loadRecords() {
            const result = await apiRequest('getRecords');
            if (!result.success) {
                showToast(result.message || '讀取紀錄失敗', 'error');
                return;
            }
            records = result.data || [];
        }

        function populateAnalysisSelect() {
            const select = document.getElementById('analysis-patient-select');
            const currentValue = select.value || 'all';
            select.innerHTML = '<option value="all">全部病患平均</option>';

            patients.filter(item => item['角色'] !== 'admin').forEach(patient => {
                const option = document.createElement('option');
                option.value = patient.ID;
                option.textContent = `${patient['姓名'] || '未命名'}${patient['病歷號'] ? ` (${patient['病歷號']})` : ''}`;
                select.appendChild(option);
            });

            select.value = Array.from(select.options).some(option => option.value === currentValue) ? currentValue : 'all';
        }

        function renderPatientsTable() {
            const tbody = document.getElementById('patients-table-body');
            if (patients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">目前沒有帳號資料</td></tr>';
                return;
            }

            tbody.innerHTML = patients.map(patient => `
                <tr>
                    <td data-label="ID"><code>${escapeHtml(patient.ID || '')}</code></td>
                    <td data-label="姓名"><strong>${escapeHtml(patient['姓名'] || '')}</strong></td>
                    <td data-label="病歷號">${escapeHtml(patient['病歷號'] || '-')}</td>
                    <td data-label="角色"><span class="badge ${patient['角色'] === 'admin' ? 'btn-danger' : 'btn-info'}" style="padding:2px 8px; border-radius:10px; font-size:11px;">${escapeHtml(patient['角色'] || 'patient')}</span></td>
                    <td data-label="操作" style="text-align: right; white-space: nowrap;">
                        <button class="btn btn-primary" style="padding:4px 10px; font-size:11px; display:inline-flex; align-items:center; gap:0.25rem;" onclick="jumpToAnalysis('${escapeAttr(patient.ID || '')}')"><i class="bi bi-bar-chart-line-fill"></i> 分析</button>
                        <button class="btn btn-outline" style="padding:4px 10px; font-size:11px; display:inline-flex; align-items:center; gap:0.25rem;" data-edit-id="${escapeAttr(patient.ID || '')}" onclick="openEditModalById(this.dataset.editId)"><i class="bi bi-pencil-fill"></i> 編輯</button>
                        <button class="btn btn-danger" style="padding:4px 10px; font-size:11px; border:none; display:inline-flex; align-items:center; gap:0.25rem;" onclick="deletePatient('${escapeAttr(patient.ID || '')}')"><i class="bi bi-trash-fill"></i> 刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function jumpToAnalysis(id) {
            document.querySelector('.tab[data-tab="data-analysis"]').click();
            document.getElementById('analysis-patient-select').value = id;
            runAnalysis(id);
        }

        function runAnalysis(targetId) {
            const ctx = document.getElementById('analysisChart').getContext('2d');
            const title = document.getElementById('chartTitle');
            const detailSection = document.getElementById('individual-detail-section');
            const tbody = document.getElementById('analysis-records-body');

            if (currentChart) currentChart.destroy();

            if (records.length === 0) {
                title.textContent = '目前沒有復健紀錄';
                detailSection.style.display = 'none';
                currentChart = new Chart(ctx, { type: 'bar', data: { labels: [], datasets: [] }, options: { responsive: true, maintainAspectRatio: false } });
                return;
            }

            if (targetId === 'all') {
                title.innerHTML = '<i class="bi bi-bar-chart-line-fill text-primary"></i> 全部病患平均疼痛趨勢';
                detailSection.style.display = 'none';

                const grouped = {};
                records.forEach(record => {
                    if (!record['日期']) return;
                    const dateKey = formatDate(record['日期']);
                    const score = painMap[record['疼痛程度']];
                    if (score === undefined) return;
                    if (!grouped[dateKey]) grouped[dateKey] = { total: 0, count: 0 };
                    grouped[dateKey].total += score;
                    grouped[dateKey].count += 1;
                });

                const chartData = Object.keys(grouped).sort().map(date => ({
                    date,
                    average: Number((grouped[date].total / grouped[date].count).toFixed(1))
                }));

                currentChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: chartData.map(item => item.date),
                        datasets: [{
                            label: '平均疼痛分數',
                            data: chartData.map(item => item.average),
                            backgroundColor: 'rgba(13, 148, 136, 0.4)',
                            borderColor: '#0d9488',
                            borderWidth: 2
                        }]
                    },
                    options: getChartOptions()
                });
                return;
            }

            const patient = patients.find(item => String(item.ID) === String(targetId));
            const individualRecords = records
                .filter(record => String(record['病患ID']) === String(targetId))
                .sort((a, b) => new Date(a['日期']) - new Date(b['日期']));

            title.innerHTML = `<i class="bi bi-activity text-primary"></i> ${escapeHtml(patient ? patient['姓名'] : '病患')} 疼痛趨勢`;
            detailSection.style.display = 'block';

            if (individualRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">此病患尚無復健紀錄</td></tr>';
                currentChart = new Chart(ctx, { type: 'line', data: { labels: [], datasets: [] }, options: getChartOptions() });
                return;
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: individualRecords.map(record => formatDate(record['日期'])),
                    datasets: [{
                        label: '疼痛分數',
                        data: individualRecords.map(record => painMap[record['疼痛程度']]),
                        borderColor: '#0284c7',
                        backgroundColor: 'rgba(2, 132, 199, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5
                    }]
                },
                options: getChartOptions()
            });

            tbody.innerHTML = individualRecords.slice().reverse().map(record => `
                <tr>
                    <td data-label="日期">${escapeHtml(formatDate(record['日期']))}</td>
                    <td data-label="疼痛程度"><span style="font-weight:700; color:var(--secondary-color);">${escapeHtml(record['疼痛程度'] || '-')}</span></td>
                    <td data-label="完成運動">${escapeHtml(record['完成運動'] || '-')}</td>
                    <td data-label="備註"><small>${escapeHtml(record['備註'] || '')}</small></td>
                    <td data-label="操作" style="text-align:right;">
                        <button class="btn btn-danger" style="padding:2px 8px; font-size:10px; border:none; display:inline-flex; align-items:center; gap:0.25rem;" onclick="deleteRecord('${escapeAttr(record.recordId || record._row)}')"><i class="bi bi-trash-fill"></i> 刪除</button>
                    </td>
                </tr>
            `).join('');
        }

        function getChartOptions() {
            return {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        min: 0,
                        max: 4,
                        ticks: { callback: value => painLabels[value] || value },
                        title: { display: true, text: '疼痛程度' }
                    }
                }
            };
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="bi bi-person-fill-add"></i> 新增帳號';
            document.getElementById('patientForm').reset();
            document.getElementById('editPatientId').value = '';
            document.getElementById('modalRole').value = 'patient';
            document.getElementById('patientModal').style.display = 'flex';
        }

        function openEditModalById(id) {
            const patient = patients.find(item => String(item.ID) === String(id));
            if (!patient) return;
            openEditModal(patient);
        }

        function openEditModal(patient) {
            document.getElementById('modalTitle').innerHTML = '<i class="bi bi-pencil-square"></i> 編輯帳號';
            document.getElementById('editPatientId').value = patient.ID || '';
            document.getElementById('modalName').value = patient['姓名'] || '';
            document.getElementById('modalPassword').value = patient['密碼'] || '';
            document.getElementById('modalRecord').value = patient['病歷號'] || '';
            document.getElementById('modalRole').value = patient['角色'] || 'patient';
            document.getElementById('patientModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('patientModal').style.display = 'none';
        }

        async function savePatient(event) {
            event.preventDefault();
            const id = document.getElementById('editPatientId').value;
            const data = {
                name: document.getElementById('modalName').value.trim(),
                password: document.getElementById('modalPassword').value,
                medicalRecordNumber: document.getElementById('modalRecord').value.trim(),
                role: document.getElementById('modalRole').value
            };

            const result = id ? await apiRequest('updatePatient', data, id) : await apiRequest('createPatient', data);
            if (result.success) {
                showToast(result.message || '已儲存');
                closeModal();
                await loadPatients();
            } else {
                showToast(result.message || '儲存失敗', 'error');
            }
        }

        async function deletePatient(id) {
            if (!confirm('確定要刪除此帳號？')) return;
            const result = await apiRequest('deletePatient', null, id);
            if (result.success) {
                showToast('帳號已刪除');
                await loadPatients();
            } else {
                showToast(result.message || '刪除失敗', 'error');
            }
        }

        async function deleteRecord(rowId) {
            if (!confirm('確定要刪除此筆紀錄？')) return;
            const result = await apiRequest('deleteRecord', null, rowId);
            if (result.success) {
                showToast('紀錄已刪除');
                await loadRecords();
                runAnalysis(document.getElementById('analysis-patient-select').value);
            } else {
                showToast(result.message || '刪除失敗', 'error');
            }
        }

        function logout() {
            sessionStorage.removeItem('currentPatient');
            window.location.href = 'index.html';
        }

        function formatDate(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
            // 使用本地時間避免 UTC 轉換造成日期偏移（台灣 UTC+8）
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }
    </script>
</body>
</html>
