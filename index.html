<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日復健紀錄系統 | 臺大醫院雲林分院 斗六院區 復健部</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Bootstrap Icons 5.3+ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Components Library -->
    <script src="js/components.js"></script>
</head>
<body>
    <!-- Header Component -->
    <div id="header-component"></div>

    <main>
        <div class="container">
            <div style="text-align: center; margin-bottom: 2rem; padding: 0 0.5rem;">
                <span class="animate-fade-up site-badge">
                    <i class="bi bi-hospital-fill" style="margin-right: 0.35rem;"></i> 臺大醫院雲林分院 斗六院區 復健部
                </span>
                <h1 class="animate-fade-up delay-100 hero-title">每日復健紀錄回報系統</h1>
                <p class="animate-fade-up delay-200 hero-desc">
                    協助個案每天記錄疼痛程度、完成的運動項目與備註，讓治療師輕鬆追蹤復健進度。
                </p>
            </div>

            <!-- 專業復健與關節活動度 (ROM) 數據主題高質感 SVG 插圖 -->
            <div class="animate-fade-up delay-300" style="text-align: center; margin-top: 1.5rem; margin-bottom: 2rem;">
                <svg width="480" height="300" viewBox="0 0 480 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
                    <defs>
                        <!-- 漸層定義 -->
                        <linearGradient id="pt-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#0d9488" />
                            <stop offset="100%" stop-color="#2dd4bf" />
                        </linearGradient>
                        <linearGradient id="pt-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
                            <stop offset="50%" stop-color="#eab308" stop-opacity="0.8" />
                            <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
                        </linearGradient>
                    </defs>

                    <!-- 背景網格微弱參考線 -->
                    <path d="M 40 40 L 440 40 M 40 100 L 440 100 M 40 160 L 440 160 M 40 220 L 440 220" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />
                    <path d="M 80 40 L 80 260 M 180 40 L 180 260 M 280 40 L 280 260 M 380 40 L 380 260" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4" />

                    <!-- 關節活動度量角器精準刻度圓弧 -->
                    <circle cx="240" cy="180" r="100" stroke="#ccfbf1" stroke-width="2" stroke-dasharray="6 6" />
                    <circle cx="240" cy="180" r="80" stroke="#0d9488" stroke-width="1" stroke-opacity="0.15" />
                    <!-- 量角器刻度線 -->
                    <line x1="240" y1="80" x2="240" y2="70" stroke="#0d9488" stroke-width="2" stroke-opacity="0.4" />
                    <line x1="140" y1="180" x2="130" y2="180" stroke="#0d9488" stroke-width="2" stroke-opacity="0.4" />
                    <line x1="340" y1="180" x2="350" y2="180" stroke="#0d9488" stroke-width="2" stroke-opacity="0.4" />
                    <line x1="169.3" y1="109.3" x2="162.2" y2="102.2" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.4" />
                    <line x1="310.7" y1="109.3" x2="317.8" y2="102.2" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.4" />

                    <!-- 生理回饋 VAS 疼痛數據平滑曲線 (橘黃到健康綠) -->
                    <path d="M 40 240 C 120 230, 160 110, 240 150 C 320 190, 360 90, 440 80" stroke="url(#pt-grad-2)" stroke-width="5" stroke-linecap="round" />

                    <!-- 人體力學主動拉伸幾何線條 (關節活動度 ROM 動態示意人像) -->
                    <!-- 軀幹 -->
                    <line x1="240" y1="180" x2="240" y2="130" stroke="#334155" stroke-width="4" stroke-linecap="round" />
                    <!-- 頭部 -->
                    <circle cx="240" cy="115" r="12" fill="#334155" />
                    <!-- 支撐腿 -->
                    <line x1="240" y1="180" x2="225" y2="255" stroke="#334155" stroke-width="4" stroke-linecap="round" />
                    <!-- 屈膝拉伸腿 -->
                    <line x1="240" y1="180" x2="275" y2="215" stroke="#334155" stroke-width="4" stroke-linecap="round" />
                    <line x1="275" y1="215" x2="345" y2="225" stroke="#0d9488" stroke-width="4" stroke-linecap="round" />
                    <!-- 主動拉伸手臂 -->
                    <line x1="240" y1="140" x2="190" y2="160" stroke="#334155" stroke-width="4" stroke-linecap="round" />
                    <!-- 指引/阻力方向線條 (ROM量測弧線) -->
                    <line x1="240" y1="140" x2="310" y2="120" stroke="#334155" stroke-width="4" stroke-linecap="round" />
                    
                    <!-- 復健生理回饋感測器數據點 (亮色點綴) -->
                    <circle cx="240" cy="130" r="6" fill="#0d9488" />
                    <circle cx="345" cy="225" r="6" fill="#0d9488" />
                    <circle cx="310" cy="120" r="6" fill="#0d9488" />
                    
                    <circle cx="240" cy="130" r="10" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.5">
                        <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
                    </circle>

                    <!-- 散落的康復大數據特徵點 -->
                    <circle cx="100" cy="80" r="3" fill="#3b82f6" opacity="0.3"/>
                    <circle cx="380" cy="70" r="4" fill="#0d9488" opacity="0.2"/>
                    <circle cx="150" cy="210" r="2.5" fill="#f59e0b" opacity="0.4"/>
                </svg>
            </div>
        </div>
    </main>

    <!-- 衛教資訊區塊 -->
    <section class="edu-section">
        <div class="container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h2 style="font-size: 1.5rem; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <i class="bi bi-journal-medical text-primary"></i> 衛教資訊
                </h2>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">點擊海報可放大檢視，歡迎列印作為居家復健參考</p>
            </div>
            <div class="edu-grid">
                <!-- 海報 1：五十肩居家復健運動 -->
                <div class="edu-card" onclick="openPosterModal('images/poster-exercise.png', '五十肩居家復健運動')">
                    <div class="edu-card-img-wrap">
                        <img src="images/poster-exercise.png" alt="五十肩居家復健運動指南"
                             onerror="this.parentNode.classList.add('img-placeholder')"
                             loading="lazy">
                        <div class="edu-card-overlay">
                            <i class="bi bi-zoom-in"></i> 點擊放大
                        </div>
                    </div>
                    <div class="edu-card-body">
                        <div class="edu-card-tag"><i class="bi bi-activity"></i> 運動指南</div>
                        <h3 class="edu-card-title">五十肩居家復健運動</h3>
                        <p class="edu-card-desc">爬牆運動、毛巾操、鐘擺運動，每天 2–3 回，持之以恆改善肩關節活動度。</p>
                    </div>
                </div>

                <!-- 海報 2：每週追蹤表 -->
                <div class="edu-card" onclick="openPosterModal('images/poster-tracker.png', '一週居家復健追蹤表')">
                    <div class="edu-card-img-wrap">
                        <img src="images/poster-tracker.png" alt="一週居家復健追蹤表"
                             onerror="this.parentNode.classList.add('img-placeholder')"
                             loading="lazy">
                        <div class="edu-card-overlay">
                            <i class="bi bi-zoom-in"></i> 點擊放大
                        </div>
                    </div>
                    <div class="edu-card-body">
                        <div class="edu-card-tag"><i class="bi bi-calendar2-check"></i> 追蹤表</div>
                        <h3 class="edu-card-title">一週居家復健追蹤表</h3>
                        <p class="edu-card-desc">記錄每天的運動完成情況，幫助您養成規律復健的好習慣。</p>
                    </div>
                </div>

                <!-- 海報 3：疼痛評估說明卡 -->
                <div class="edu-card" onclick="openPosterModal('images/poster-pain.png', '疼痛程度評估說明')">
                    <div class="edu-card-img-wrap">
                        <img src="images/poster-pain.png" alt="疼痛程度評估說明"
                             onerror="this.parentNode.classList.add('img-placeholder')"
                             loading="lazy">
                        <div class="edu-card-overlay">
                            <i class="bi bi-zoom-in"></i> 點擊放大
                        </div>
                    </div>
                    <div class="edu-card-body">
                        <div class="edu-card-tag"><i class="bi bi-heart-pulse"></i> 疼痛評估</div>
                        <h3 class="edu-card-title">疼痛程度評估說明</h3>
                        <p class="edu-card-desc">了解無痛到極度疼痛的 5 個等級，幫助您在系統中如實填寫每日狀況。</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Poster Modal Component -->
    <div id="poster-modal-component"></div>

    <!-- Footer Component -->
    <div id="footer-component"></div>

    <!-- Legal Modal Component -->
    <div id="legal-modal-component"></div>

    <script>
        // 初始化組件
        document.addEventListener('DOMContentLoaded', () => {
            initComponents({
                header: true,
                footer: true,
                legalModal: true,
                posterModal: true
            });
        });

        // 判斷是否為 Session 第一次載入 (處理進場動畫)
        (() => {
            // 開發測試友善機制：如果網址包含 ?test=1 或 ?reset=1，自動清除 session 紀錄以利重複測試動畫
            if (window.location.search.includes('test=1') || window.location.search.includes('reset=1')) {
                sessionStorage.removeItem('hasSeenIndexAnimation');
            }

            const initAnimation = () => {
                if (sessionStorage.getItem('hasSeenIndexAnimation')) {
                    // 如果已看過，移除所有動畫類別，直接顯示
                    document.querySelectorAll('.animate-fade-up').forEach(el => {
                        el.classList.remove('animate-fade-up', 'delay-100', 'delay-200');
                        el.style.opacity = '1';
                        el.style.transform = 'none';
                    });
                } else {
                    // 第一次看，標記為已看過
                    sessionStorage.setItem('hasSeenIndexAnimation', 'true');
                }
            };

            // 安全守護：若 DOM 已處於 interactive 或 complete 狀態則直接執行，避免錯過 DOMContentLoaded 事件
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initAnimation);
            } else {
                initAnimation();
            }
        })();

        // 海報燈箱功能
        function openPosterModal(src, title) {
            document.getElementById('posterModalImg').src = src;
            document.getElementById('posterModalTitle').textContent = title;
            document.getElementById('posterModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closePosterModal() {
            document.getElementById('posterModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closePosterModal();
        });
    </script>
</body>
</html>
