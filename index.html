<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復健紀錄管理系統</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }
        .card-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            display: block;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }
        .card:hover {
            background-color: #e9f5ff;
            border-color: #4CAF50;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.2);
        }
        .card h3 {
            margin: 0 0 8px 0;
            color: #2c3e50;
        }
        .card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 復健紀錄管理系統</h1>
        <p class="subtitle">病患復健追蹤與管理平台</p>

        <div class="card-container">
            <a href="login.html" class="card">
                <h3>👤 病患登入</h3>
                <p>病患可登入系統填寫每日復健紀錄</p>
            </a>

            <a href="rehab-form.html" class="card">
                <h3>📝 復健紀錄表單</h3>
                <p>填寫每日疼痛程度、完成運動與備註</p>
            </a>

            <a href="admin.html" class="card">
                <h3>⚙️ 後台管理</h3>
                <p>治療師管理患者帳號與查看復健紀錄</p>
            </a>
        </div>

        <div class="footer">
            <p>2026 復健紀錄管理系統 v1.0</p>
        </div>
    </div>
</body>
</html>
