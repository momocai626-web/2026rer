<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>復健紀錄管理系統 - 醫療專業版</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            text-align: center;
        }
        .hero-section {
            padding: 2rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }
        .hero-section p {
            font-size: 1.125rem;
            color: var(--text-secondary);
        }
        .welcome-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: var(--primary-light);
            color: var(--primary-color);
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <span class="welcome-badge">2026 Healthcare Platform</span>
            <h1>🏥 復健紀錄管理系統</h1>
            <p>專業、直覺且高效的病患復健追蹤與管理平台</p>
        </div>

        <div class="card-grid">
            <a href="login.html" class="card">
                <div class="icon">👤</div>
                <h3>病患登入</h3>
                <p>登入系統填寫每日復健表單，追蹤您的康復進度。</p>
            </a>

            <a href="rehab-form.html" class="card">
                <div class="icon">📝</div>
                <h3>紀錄表單</h3>
                <p>快速填寫今日的疼痛程度、完成運動項目與個人備註。</p>
            </a>

            <a href="admin.html" class="card">
                <div class="icon">⚙️</div>
                <h3>後台管理</h3>
                <p>醫療團隊專用，管理患者帳號、分析復健數據與疼痛趨勢。</p>
            </a>
        </div>

        <div class="footer">
            <p>© 2026 復健紀錄管理系統 Professional v1.1</p>
            <p>致力於提供更好的康復體驗</p>
        </div>
    </div>
</body>
</html>
